<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010204">
<meta name="description" content="KI-Wahnsinn – Das offene Arbeitsbuch von THE WHITE-BOX SYSTEM.">
<title>KI-Wahnsinn · Das offene Arbeitsbuch | THE WHITE-BOX SYSTEM</title>
<link rel="stylesheet" href="../style.css">
<style>
/* Glasbuch: Gestaltung und Typografie aus dem globalen WHITE-BOX-Stylesheet */
.book-hero{
  max-width:var(--max);
  margin:auto;
  padding:clamp(2rem,4vw,3.5rem) 1.5rem 1rem;
  text-align:center;
}
.book-hero .eyebrow{margin-bottom:.7rem}
.book-hero h1{
  max-width:900px;
  margin:0 auto .65rem;
}
.book-hero h1 span{
  color:var(--copper-light);
  background:linear-gradient(105deg,#a95f38 0%,#f2c09a 24%,#c8794b 48%,#f4d1b3 68%,#a95f38 100%);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(201,121,75,.18));
}
.book-hero .lead{
  max-width:760px;
  margin:0 auto;
}
.book-composition{
  width:min(1160px,96vw);
  margin:clamp(1rem,2.5vw,2rem) auto 0;
  padding:0 1rem 2.2rem;
  display:grid;
  grid-template-columns:minmax(260px,.78fr) minmax(0,1.72fr);
  align-items:center;
  gap:clamp(14px,2.3vw,34px);
}
.book-cover-column{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.book-cover-frame{
  width:100%;
  max-width:390px;
  margin:0;
  position:relative;
  filter:drop-shadow(0 20px 34px rgba(0,0,0,.68));
}
.book-cover-frame img{
  display:block;
  width:100%;
  height:auto;
  max-height: min(72vh,720px);
  object-fit:contain;
}
.book-spread{
  min-width:0;
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  align-items:stretch;
  gap:0;
  perspective:1600px;
}
.book-page{
  min-width:0;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:transparent;
}
.book-page img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1/1;
  object-fit:contain;
}
.book-page-left{transform-origin:right center}
.book-page-right{transform-origin:left center}
.book-foot{
  max-width:var(--max);
  margin:0 auto;
  padding:0 1.5rem 2rem;
  text-align:center;
  color:var(--muted);
  font-size:.72rem;
  letter-spacing:.16em;
  text-transform:uppercase;
}
@media(max-width:760px){
  .book-hero{padding:2rem 1rem .5rem}
  .book-composition{
    width:min(680px,98vw);
    grid-template-columns:minmax(0,1fr);
    gap:1rem;
    padding:0 .5rem 1.7rem;
  }
  .book-cover-frame{width:min(74vw,330px);max-width:330px}
  .book-cover-frame img{max-height:54vh}
  .book-spread{width:100%;max-width:660px;margin:0 auto}
  .book-page img{width:100%;height:auto}
}
@media(max-width:420px){
  .book-composition{width:100%;padding-left:0;padding-right:0}
  .book-spread{width:100%}
}
</style>
</head>
<body>
<header class="site-header">
  <nav class="site-nav" aria-label="Hauptnavigation">
    <a href="../index.html">Start</a>
    <a href="../system.html">System</a>
    <a href="../diagnosis.html">Diagnose</a>
    <a href="../pruefung.html">Prüfung</a>
    <a href="../workshop.html">Workshop</a>
    <a href="../sectors.html">Anwendungsbereiche</a>
    <a href="../ki-wahnsinn.html" class="active">KI-Wahnsinn</a>
    <a href="../collaborate.html">Zusammenarbeit</a>
    <a href="../contact.html">Kontakt</a>
  </nav>
</header>

<main>
  <section class="book-hero welcome-hero">
    <p class="eyebrow">Ein offenes Arbeitsbuch</p>
    <h1>KI-Wahnsinn</h1>
    <p class="lead">Gedanken. Diagnosen. Erfahrungen. Beobachtungen.<br>
      Ein Buch mit einem Anfang – aber ohne vorgeschriebenen Denkweg.</p>
  </section>

  <section class="book-composition" aria-label="Buchcover links und offene leere Doppelseite rechts">
    <div class="book-cover-column">
      <figure class="book-cover-frame">
        <img src="assets/cover-standing.webp"
             alt="Das aufrecht stehende Cover des Arbeitsbuchs KI-Wahnsinn"
             fetchpriority="high">
      </figure>
    </div>

    <div class="book-spread" aria-label="Leere linke und rechte Buchseite">
      <figure class="book-page book-page-left">
        <img src="assets/page-left.webp" alt="Leere linke Buchseite">
      </figure>
      <figure class="book-page book-page-right">
        <img src="assets/page-right.webp" alt="Leere rechte Buchseite">
      </figure>
    </div>
  </section>
</main>

<footer class="book-foot">
  Visueller Master · Seiten werden einzeln ergänzt
</footer>
</body>
</html>
