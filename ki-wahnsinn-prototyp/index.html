<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010204">
<meta name="description" content="KI-Wahnsinn – Das offene Arbeitsbuch von THE WHITE-BOX SYSTEM.">
<title>KI-Wahnsinn · Das offene Arbeitsbuch | THE WHITE-BOX SYSTEM</title>
<link rel="stylesheet" href="../style.css">
<style>
.book-hero{
  max-width:var(--max);
  margin:auto;
  padding:clamp(1.5rem,2.5vw,2.2rem) 1.5rem .35rem;
  text-align:center;
}
.book-hero .eyebrow{margin-bottom:.45rem}
.book-hero h1{margin:0 auto .4rem}
.book-hero h1 span{
  color:var(--copper-light);
  background:linear-gradient(105deg,#a95f38 0%,#f2c09a 24%,#c8794b 48%,#f4d1b3 68%,#a95f38 100%);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(201,121,75,.18));
}
.book-hero .lead{max-width:760px;margin:0 auto}
.book-composition{
  width:min(860px,96vw);
  margin:.8rem auto 0;
  padding:0 .5rem .45rem;
  display:grid;
  grid-template-columns:minmax(0,240px) minmax(0,520px);
  align-items:center;
  justify-content:center;
  gap:clamp(14px,2vw,26px);
}
.book-cover-column{min-width:0;display:flex;align-items:center;justify-content:center}
.book-cover-frame{
  width:100%;
  max-width:240px;
  margin:0;
  filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));
}
.book-cover-frame img{display:block;width:100%;height:auto;object-fit:contain}
.book-spread{
  position:relative;
  min-width:0;
  width:100%;
  max-width:520px;
  aspect-ratio:2/1;
  overflow:visible;
  perspective:1800px;
  transform-style:preserve-3d;
  isolation:isolate;
}
.book-spread-art{
  position:absolute;
  inset:0;
  z-index:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.book-page{
  position:absolute;
  top:0;
  bottom:0;
  z-index:1;
  width:50%;
  min-width:0;
  margin:0;
  overflow:hidden;
}
.book-page-left{left:0}
.book-page-right{right:0}
.book-writing{
  position:absolute;
  inset:14% 13% 14% 13%;
  z-index:2;
  overflow:auto;
  color:#e5edf7;
  font:clamp(9px,.82vw,13px)/1.55 Arial,Helvetica,sans-serif;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  outline:none;
  caret-color:#f2c09a;
  scrollbar-width:thin;
  scrollbar-color:rgba(84,229,243,.45) transparent;
}
.book-writing:focus-visible{outline:1px solid rgba(84,229,243,.35);outline-offset:3px}
.page-flip-layer{
  position:absolute;
  top:0;
  bottom:0;
  z-index:10;
  width:50%;
  pointer-events:none;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transition:transform 1.9s cubic-bezier(.42,.04,.28,1),filter 1.9s ease;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.62));
  will-change:transform;
}
.page-flip-layer.next{right:0;transform-origin:left center;transform:rotateY(0deg)}
.page-flip-layer.prev{left:0;transform-origin:right center;transform:rotateY(0deg)}
.page-flip-layer.next.turning{transform:rotateY(-180deg);filter:brightness(.78) drop-shadow(-9px 2px 12px rgba(0,0,0,.55))}
.page-flip-layer.prev.turning{transform:rotateY(180deg);filter:brightness(.78) drop-shadow(9px 2px 12px rgba(0,0,0,.55))}
.page-flip-layer:before{
  content:"";
  position:absolute;
  z-index:4;
  top:2%;
  bottom:2%;
  width:3px;
  background:linear-gradient(180deg,transparent,#e8f8ff 16%,#55dfff 48%,#f3bd71 82%,transparent);
  box-shadow:0 0 7px rgba(84,229,243,.75),0 0 16px rgba(232,184,107,.42);
  opacity:.78;
  pointer-events:none;
}
.page-flip-layer.next:before{left:0}
.page-flip-layer.prev:before{right:0}
.page-flip-layer.turning:before{
  opacity:1;
  box-shadow:0 0 11px rgba(84,229,243,.95),0 0 24px rgba(232,184,107,.72);
}
.page-flip-face{
  position:absolute;
  inset:0;
  display:block;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  background-image:url("assets/open-spread-clean.webp");
  background-repeat:no-repeat;
  background-size:200% 100%;
  box-shadow:inset 0 0 16px rgba(0,0,0,.14);
}
.page-flip-face.front{transform:rotateY(0deg)}
.page-flip-face.back{transform:rotateY(180deg);filter:brightness(.86)}
.page-flip-layer.next .front{background-position:right center}
.page-flip-layer.next .back{background-position:left center}
.page-flip-layer.prev .front{background-position:left center}
.page-flip-layer.prev .back{background-position:right center}
.page-flip-layer:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.14),transparent 18%,transparent 84%,rgba(0,0,0,.28));
  opacity:.8;
}
.book-controls{
  width:min(520px,92vw);
  margin:.5rem auto 1rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:1rem;
}
.page-counter{
  min-width:94px;
  text-align:center;
  color:var(--muted);
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.15em;
  font-variant-numeric:tabular-nums;
}
.book-controls button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border:1px solid rgba(201,121,75,.55);
  border-radius:50%;
  color:var(--text);
  background:rgba(255,255,255,.025);
  font-size:1.25rem;
  cursor:pointer;
}
.book-controls button:hover{background:rgba(201,121,75,.14)}
.book-controls button:disabled{opacity:.3;cursor:not-allowed}
.book-foot{
  max-width:var(--max);
  margin:0 auto;
  padding:0 1.5rem 1.2rem;
  text-align:center;
  color:var(--muted);
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}
@media(max-width:760px){
  .book-hero{padding:1.5rem 1rem .35rem}
  .book-composition{
    width:min(560px,96vw);
    grid-template-columns:minmax(0,1fr);
    gap:.65rem;
    padding:0 .2rem .35rem;
  }
  .book-cover-frame{width:min(48vw,210px);max-width:210px}
  .book-spread{width:100%;max-width:520px;margin:0 auto}
  .book-writing{font-size:clamp(10px,2vw,13px)}
  .book-controls{margin:.35rem auto .8rem}
}
@media(max-width:420px){
  .book-composition{width:100%;padding-left:0;padding-right:0}
  .book-cover-frame{width:min(48vw,190px)}
  .book-spread{width:100%}
  .book-controls{gap:.65rem}
  .book-controls button{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){.page-flip-layer{transition:none}}
</style>
</head>
<body>
<header class="site-header">
  <nav class="site-nav" aria-label="Hauptnavigation">
    <a href="../index.html">Start</a>
    <a href="../system.html">System</a>
    <a href="../diagnosis.html">Diagnose</a>
    <a href="../pruefung.html">Prüfung</a>
    <a href="../workshop.html">Workshop</a>
    <a href="../sectors.html">Anwendungsbereiche</a>
    <a href="../ki-wahnsinn.html" class="active">KI-Wahnsinn</a>
    <a href="../collaborate.html">Zusammenarbeit</a>
    <a href="../contact.html">Kontakt</a>
  </nav>
</header>

<main>
  <section class="book-hero welcome-hero">
    <p class="eyebrow">Ein offenes Arbeitsbuch</p>
    <h1><span>KI-Wahnsinn</span></h1>
    <p class="lead">Gedanken. Diagnosen. Erfahrungen. Beobachtungen.<br>
      Ein Buch mit einem Anfang – aber ohne vorgeschriebenen Denkweg.</p>
  </section>

  <section class="book-composition" aria-label="Buchcover links und vollständig sichtbare leere Doppelseite rechts">
    <div class="book-cover-column">
      <figure class="book-cover-frame">
        <img src="assets/cover-standing.webp"
             alt="Das Cover des Arbeitsbuchs KI-Wahnsinn"
             fetchpriority="high">
      </figure>
    </div>

    <div class="book-spread" id="bookSpread" aria-label="Leere offene Doppelseite">
      <img class="book-spread-art" src="assets/open-spread-clean.webp"
           alt="Leere offene Glasbuch-Doppelseite mit blauen und kupferfarbenen Leuchträndern">
      <div class="book-page book-page-left">
        <div class="book-writing" id="leftWriting" contenteditable="true" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="Leere linke Buchseite"></div>
      </div>
      <div class="book-page book-page-right">
        <div class="book-writing" id="rightWriting" contenteditable="true" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="Leere rechte Buchseite"></div>
      </div>
    </div>
  </section>

  <div class="book-controls" aria-label="Buchnavigation">
    <button id="previousButton" type="button" aria-label="Vorherige Doppelseite" title="Zurück">‹</button>
    <span id="pageCounter" class="page-counter" aria-live="polite">01–02 / 24</span>
    <button id="nextButton" type="button" aria-label="Nächste Doppelseite" title="Weiter">›</button>
  </div>
</main>

<footer class="book-foot">
  THE WHITE-BOX SYSTEM
</footer>

<script>
(() => {
  const totalPages = 24;
  const spread = document.getElementById('bookSpread');
  const leftWriting = document.getElementById('leftWriting');
  const rightWriting = document.getElementById('rightWriting');
  const previousButton = document.getElementById('previousButton');
  const nextButton = document.getElementById('nextButton');
  const pageCounter = document.getElementById('pageCounter');
  let firstPage = 1;
  let turning = false;

  const storageKey = page => 'whitebox-ki-wahnsinn-page-' + page;

  function saveCurrentPages() {
    try {
      localStorage.setItem(storageKey(firstPage), leftWriting.innerText);
      localStorage.setItem(storageKey(firstPage + 1), rightWriting.innerText);
    } catch (_) {}
  }

  function loadPage(element, page) {
    try {
      element.textContent = localStorage.getItem(storageKey(page)) || '';
    } catch (_) {
      element.textContent = '';
    }
    element.setAttribute('aria-label', page % 2 ? 'Buchseite ' + page : 'Buchseite ' + page);
  }

  function createFlipLayer(direction) {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return null;

    spread.querySelectorAll('.page-flip-layer').forEach(layer => layer.remove());

    const layer = document.createElement('div');
    layer.className = 'page-flip-layer ' + direction;
    layer.setAttribute('aria-hidden', 'true');

    const front = document.createElement('div');
    front.className = 'page-flip-face front';
    const back = document.createElement('div');
    back.className = 'page-flip-face back';

    layer.append(front, back);
    spread.appendChild(layer);

    // Zwei Frames stellen sicher, dass der Startzustand gezeichnet wird,
    // bevor die Seite sichtbar um die Buchfalz rotiert.
    void layer.offsetWidth;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => layer.classList.add('turning'));
    });

    return layer;
  }

  function renderSpread(direction) {
    const layer = direction ? createFlipLayer(direction) : null;

    loadPage(leftWriting, firstPage);
    loadPage(rightWriting, firstPage + 1);

    previousButton.disabled = firstPage <= 1;
    nextButton.disabled = firstPage >= totalPages - 1;
    pageCounter.textContent =
      String(firstPage).padStart(2, '0') + '–' +
      String(firstPage + 1).padStart(2, '0') + ' / ' + totalPages;

    if (layer) {
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        layer.remove();
        turning = false;
      };
      layer.addEventListener('transitionend', event => {
        if (event.propertyName === 'transform') finish();
      });
      window.setTimeout(finish, 2150);
    } else {
      turning = false;
    }
  }

  leftWriting.addEventListener('input', saveCurrentPages);
  rightWriting.addEventListener('input', saveCurrentPages);

  previousButton.addEventListener('click', () => {
    if (turning || firstPage <= 1) return;
    saveCurrentPages();
    turning = true;
    firstPage -= 2;
    renderSpread('prev');
  });

  nextButton.addEventListener('click', () => {
    if (turning || firstPage >= totalPages - 1) return;
    saveCurrentPages();
    turning = true;
    firstPage += 2;
    renderSpread('next');
  });

  document.addEventListener('keydown', event => {
    if (event.target && event.target.isContentEditable) return;
    if (event.key === 'ArrowRight') nextButton.click();
    if (event.key === 'ArrowLeft') previousButton.click();
  });

  renderSpread();
})();
</script>
</body>
</html>
