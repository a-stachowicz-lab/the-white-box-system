<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="KI-Wahnsinn – Das offene Arbeitsbuch.">
<title>KI-Wahnsinn · Das offene Arbeitsbuch</title>
<style>
:root{
  color-scheme:dark;
  --gold:#e9b86b;
  --cyan:#63dfff;
  --text:#eaf2f7;
  --muted:#9bb2c5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text)}
body{
  min-height:100vh;
  min-height:100svh;
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
  background:#000;
}
.topline{
  min-height:44px;
  padding:0 clamp(16px,3vw,50px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid rgba(99,223,255,.18);
  color:#a9c2d2;
  font-size:10px;
  font-weight:700;
  letter-spacing:.19em;
  text-transform:uppercase;
}
.brand{color:#e7c58e}
.brand span{color:var(--cyan)}
.prototype{white-space:nowrap;color:#8ba8bc}
main{
  width:min(1180px,100%);
  margin:0 auto;
  padding:clamp(28px,5vh,58px) 20px 48px;
}
.intro{text-align:center;margin:0 auto 22px}
.eyebrow{
  margin:0 0 10px;
  color:var(--gold);
  font-size:10px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font:clamp(42px,6vw,68px)/1.05 Georgia,serif;
  letter-spacing:.01em;
  color:#d9a477;
  background:linear-gradient(108deg,#8c4b2e 0%,#f2d0a5 28%,#b96f48 50%,#f4d1b3 70%,#8c4b2e 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 9px rgba(201,121,75,.18));
}
.subtitle{
  margin:12px auto 0;
  max-width:650px;
  color:#b7cbd9;
  font-size:clamp(13px,1.5vw,16px);
  line-height:1.65;
}
.book-stage{
  min-height:clamp(440px,68vh,760px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 0 24px;
  background:#000;
}
.book-cover{
  display:flex;
  align-items:center;
  justify-content:center;
  width:min(78vw,460px);
  max-height:68vh;
  margin:0;
  filter:drop-shadow(0 24px 35px rgba(0,0,0,.85));
}
.book-cover img{
  display:block;
  width:100%;
  height:auto;
  max-height:68vh;
  object-fit:contain;
}
.foot{
  padding:12px 16px 26px;
  color:#58748a;
  text-align:center;
  font-size:9px;
  font-weight:600;
  letter-spacing:.2em;
  text-transform:uppercase;
}
@media(max-width:640px){
  .topline{min-height:40px;padding:0 12px;font-size:8px;letter-spacing:.12em}
  main{padding:30px 14px 28px}
  .intro{margin-bottom:8px}
  .book-stage{min-height:58vh;min-height:58svh;padding:8px 0 20px}
  .book-cover{width:min(84vw,390px);max-height:60svh}
  .book-cover img{max-height:60svh}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="topline">
  <div class="brand">THE WHITE-BOX SYSTEM <span>· PARALLEL SPACE</span></div>
  <div class="prototype">OFFLINE-PROTOTYP · GLASSBOOK</div>
</div>
<main>
  <header class="intro">
    <p class="eyebrow">Ein offenes Arbeitsbuch</p>
    <h1>KI-Wahnsinn</h1>
    <p class="subtitle">Gedanken. Diagnosen. Erfahrungen. Beobachtungen.</p>
  </header>
  <section class="book-stage" aria-label="Buchcover">
    <figure class="book-cover">
      <img src="assets/cover-standing.webp" alt="Das aufrecht stehende Glasbuch-Cover: KI-Wahnsinn – Das offene Arbeitsbuch" fetchpriority="high">
    </figure>
  </section>
</main>
<footer class="foot">VISUELLER MASTER · SEITEN WERDEN EINZELN ERGÄNZT</footer>
</body>
</html>
