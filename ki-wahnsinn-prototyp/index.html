<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010204">
<meta name="description" content="KI-Wahnsinn – Das offene Arbeitsbuch von THE WHITE-BOX SYSTEM.">
<title>KI-Wahnsinn · Das offene Arbeitsbuch | THE WHITE-BOX SYSTEM</title>
<link rel="stylesheet" href="../style.css">
<style>
.book-hero{
  max-width:var(--max);
  margin:auto;
  padding:clamp(1.5rem,2.5vw,2.2rem) 1.5rem .35rem;
  text-align:center;
}
.book-hero .eyebrow{margin-bottom:.45rem}
.book-hero h1{margin:0 auto .4rem}
.book-hero h1 span{
  color:var(--copper-light);
  background:linear-gradient(105deg,#a95f38 0%,#f2c09a 24%,#c8794b 48%,#f4d1b3 68%,#a95f38 100%);
  background-clip:text;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(201,121,75,.18));
}
.book-hero .lead{max-width:760px;margin:0 auto}
.book-composition{
  width:min(600px,96vw);
  margin:.5rem auto 0;
  padding:0 .5rem .35rem;
  display:grid;
  grid-template-columns:minmax(0,180px) minmax(0,360px);
  align-items:center;
  justify-content:center;
  gap:clamp(8px,1.2vw,16px);
}
.book-cover-column{min-width:0;display:flex;align-items:center;justify-content:center}
.book-cover-frame{
  width:100%;
  max-width:210px;
  margin:0;
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.4));
}
.book-cover-frame img{display:block;width:100%;height:auto;object-fit:contain}
.book-spread{
  position:relative;
  min-width:0;
  width:100%;
  max-width:360px;
  aspect-ratio:2/1;
  overflow:visible;
  perspective:1400px;
  transform-style:preserve-3d;
}
.book-spread-art{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.book-page{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  min-width:0;
  margin:0;
  overflow:hidden;
}
.book-page-left{left:0}
.book-page-right{right:0}
.book-writing{
  position:absolute;
  inset:13.5% 15% 15% 15%;
  z-index:2;
  overflow:auto;
  color:#e5edf7;
  font:clamp(8px,.72vw,11px)/1.5 Arial,Helvetica,sans-serif;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  outline:none;
  caret-color:#f2c09a;
  scrollbar-width:thin;
  scrollbar-color:rgba(84,229,243,.45) transparent;
}
.book-writing:focus-visible{outline:1px solid rgba(84,229,243,.35);outline-offset:3px}
.page-flip-layer{
  position:absolute;
  top:0;
  bottom:0;
  z-index:8;
  width:50%;
  pointer-events:none;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:transform .58s cubic-bezier(.2,.72,.18,1),filter .58s ease;
  box-shadow:0 0 24px rgba(0,0,0,.32);
}
.page-flip-layer.next{
  right:0;
  transform-origin:left center;
  background-image:url("assets/open-spread-clean.webp");
  background-repeat:no-repeat;
  background-size:200% 100%;
  background-position:right center;
}
.page-flip-layer.prev{
  left:0;
  transform-origin:right center;
  background-image:url("assets/open-spread-clean.webp");
  background-repeat:no-repeat;
  background-size:200% 100%;
  background-position:left center;
}
.page-flip-layer.next.turning{transform:rotateY(-180deg);filter:brightness(.72)}
.page-flip-layer.prev.turning{transform:rotateY(180deg);filter:brightness(.72)}
.book-controls{
  width:min(520px,92vw);
  margin:.25rem auto 1rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:1rem;
}
.book-controls button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border:1px solid rgba(201,121,75,.55);
  border-radius:50%;
  color:var(--text);
  background:rgba(255,255,255,.025);
  font-size:1.25rem;
  cursor:pointer;
}
.book-controls button:hover{background:rgba(201,121,75,.14)}
.book-controls button:disabled{opacity:.3;cursor:not-allowed}
.book-foot{
  max-width:var(--max);
  margin:0 auto;
  padding:0 1.5rem 1.2rem;
  text-align:center;
  color:var(--muted);
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}
@media(max-width:760px){
  .book-hero{padding:1.5rem 1rem .35rem}
  .book-composition{
    width:min(400px,96vw);
    grid-template-columns:minmax(0,1fr);
    gap:.4rem;
    padding:0 .2rem .25rem;
  }
  .book-cover-frame{width:min(34vw,170px);max-width:170px}
  .book-spread{width:100%;max-width:360px;margin:0 auto}
  .book-writing{font-size:clamp(8px,1.7vw,11px)}
  .book-controls{margin:.3rem auto .8rem}
}
@media(max-width:420px){
  .book-composition{width:100%;padding-left:0;padding-right:0}
  .book-cover-frame{width:min(38vw,145px)}
  .book-spread{width:100%}
  .book-controls button{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){.page-flip-layer{transition:none}}
</style>
</head>
<body>
<header class="site-header">
  <nav class="site-nav" aria-label="Hauptnavigation">
    <a href="../index.html">Start</a>
    <a href="../system.html">System</a>
    <a href="../diagnosis.html">Diagnose</a>
    <a href="../pruefung.html">Prüfung</a>
    <a href="../workshop.html">Workshop</a>
    <a href="../sectors.html">Anwendungsbereiche</a>
    <a href="../ki-wahnsinn.html" class="active">KI-Wahnsinn</a>
    <a href="../collaborate.html">Zusammenarbeit</a>
    <a href="../contact.html">Kontakt</a>
  </nav>
</header>

<main>
  <section class="book-hero welcome-hero">
    <p class="eyebrow">Ein offenes Arbeitsbuch</p>
    <h1><span>KI-Wahnsinn</span></h1>
    <p class="lead">Gedanken. Diagnosen. Erfahrungen. Beobachtungen.<br>
      Ein Buch mit einem Anfang – aber ohne vorgeschriebenen Denkweg.</p>
  </section>

  <section class="book-composition" aria-label="Buchcover links und vollständig sichtbare leere Doppelseite rechts">
    <div class="book-cover-column">
      <figure class="book-cover-frame">
        <img src="assets/cover-standing.webp"
             alt="Das Cover des Arbeitsbuchs KI-Wahnsinn"
             fetchpriority="high">
      </figure>
    </div>

    <div class="book-spread" id="bookSpread" aria-label="Leere offene Doppelseite">
      <img class="book-spread-art" src="assets/open-spread-clean.webp"
           alt="Leere offene Glasbuch-Doppelseite mit blauen und kupferfarbenen Leuchträndern">
      <div class="book-page book-page-left">
        <div class="book-writing" id="leftWriting" contenteditable="true" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="Leere linke Buchseite"></div>
      </div>
      <div class="book-page book-page-right">
        <div class="book-writing" id="rightWriting" contenteditable="true" spellcheck="false"
             role="textbox" aria-multiline="true" aria-label="Leere rechte Buchseite"></div>
      </div>
    </div>
  </section>

  <div class="book-controls" aria-label="Buchnavigation">
    <button id="previousButton" type="button" aria-label="Vorherige Doppelseite" title="Zurück">‹</button>
    <button id="nextButton" type="button" aria-label="Nächste Doppelseite" title="Weiter">›</button>
  </div>
</main>

<footer class="book-foot">
  THE WHITE-BOX SYSTEM
</footer>

<script>
(() => {
  const totalPages = 24;
  const spread = document.getElementById('bookSpread');
  const leftWriting = document.getElementById('leftWriting');
  const rightWriting = document.getElementById('rightWriting');
  const previousButton = document.getElementById('previousButton');
  const nextButton = document.getElementById('nextButton');
  let firstPage = 1;

  const storageKey = page => 'whitebox-ki-wahnsinn-page-' + page;

  function saveCurrentPages() {
    try {
      localStorage.setItem(storageKey(firstPage), leftWriting.innerText);
      localStorage.setItem(storageKey(firstPage + 1), rightWriting.innerText);
    } catch (_) {}
  }

  function loadPage(element, page) {
    try {
      element.textContent = localStorage.getItem(storageKey(page)) || '';
    } catch (_) {
      element.textContent = '';
    }
    element.setAttribute('aria-label', page % 2 ? 'Leere linke Buchseite' : 'Leere rechte Buchseite');
  }

  function createFlipLayer(direction) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    spread.querySelectorAll('.page-flip-layer').forEach(layer => layer.remove());
    const source = spread.querySelector(direction === 'next' ? '.book-page-right' : '.book-page-left');
    if (!source) return;
    const layer = source.cloneNode(true);
    layer.classList.add('page-flip-layer', direction);
    layer.setAttribute('aria-hidden', 'true');
    layer.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
    layer.querySelectorAll('[contenteditable]').forEach(node => node.removeAttribute('contenteditable'));
    spread.appendChild(layer);
    requestAnimationFrame(() => layer.classList.add('turning'));
    const cleanup = () => layer.remove();
    layer.addEventListener('transitionend', event => {
      if (event.propertyName === 'transform') cleanup();
    });
    window.setTimeout(cleanup, 800);
  }

  function renderSpread(direction) {
    if (direction) createFlipLayer(direction);
    loadPage(leftWriting, firstPage);
    loadPage(rightWriting, firstPage + 1);
    previousButton.disabled = firstPage <= 1;
    nextButton.disabled = firstPage >= totalPages - 1;
  }

  leftWriting.addEventListener('input', saveCurrentPages);
  rightWriting.addEventListener('input', saveCurrentPages);

  previousButton.addEventListener('click', () => {
    if (firstPage <= 1) return;
    saveCurrentPages();
    firstPage -= 2;
    renderSpread('prev');
  });

  nextButton.addEventListener('click', () => {
    if (firstPage >= totalPages - 1) return;
    saveCurrentPages();
    firstPage += 2;
    renderSpread('next');
  });

  document.addEventListener('keydown', event => {
    if (event.target && event.target.isContentEditable) return;
    if (event.key === 'ArrowRight') nextButton.click();
    if (event.key === 'ArrowLeft') previousButton.click();
  });

  renderSpread();
})();
</script>
</body>
</html>
